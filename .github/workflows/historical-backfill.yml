name: جمع بيانات NASDAQ التاريخية

on:
  schedule:
    # التشغيل كل 90 دقيقة تقريباً.
    #
    # توقيت GitHub = UTC
    # بغداد = UTC+3
    #
    # تم ترك فترة 05:00 - 07:00 بغداد بدون تشغيل.
    #
    # 00:00 UTC = 03:00 بغداد
    # 01:30 UTC = 04:30 بغداد
    # 04:30 UTC = 07:30 بغداد
    # ثم يستمر كل 90 دقيقة.
    
    - cron: '0 0,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'

  workflow_dispatch:

concurrency:
  group: historical-nasdaq-backfill
  cancel-in-progress: false

jobs:
  collect-historical-data:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات المطلوبة
        run: pip install requests

      - name: جلب يوم تاريخي واحد
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch-finnhub-historical.py

      - name: حفظ البيانات التاريخية بالمستودع
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add daily-data/ historical-progress.json

          git commit -m "إضافة بيانات NASDAQ التاريخية" || echo "لا توجد تغييرات جديدة للحفظ"

          git push
