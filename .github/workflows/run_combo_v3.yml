name: Nasdaq Combo-Only Engine V3

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Nasdaq Data Collector"
    types:
      - completed

permissions:
  contents: write

jobs:
  run-combo-v3:
    # If this was triggered by the data collector, only continue when it succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Verify input data
        run: |
          test -d daily-data
          count=$(find daily-data -maxdepth 1 -type f -name '*.json' | wc -l)
          echo "JSON files: $count"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: daily-data contains no JSON files."
            exit 1
          fi

      - name: Run Nasdaq Combo-Only Engine V3
        run: |
          python engines/nasdaq_combo_only_engine_v3.py

      - name: Show final results
        run: |
          echo "===== SUMMARY ====="
          cat results_combo_v3/combo_only_summary.json
          echo
          echo "===== RANKED COMBINATIONS ====="
          head -n 31 results_combo_v3/combo_only_ranked.csv || true
          echo
          echo "===== OOS ====="
          head -n 31 results_combo_v3/combo_only_oos.csv || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results_combo_v3/

          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          git commit -m "Run Nasdaq Combo-Only Engine V3"
          git push
