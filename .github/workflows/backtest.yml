name: Nasdaq Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تشغيل Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل محرك الاختبار
        run: |
          python backtest/engine.py

      - name: حفظ نتائج الاختبار
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-backtest-results
          path: results/

      - name: حفظ النتائج في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/

          git diff --cached --quiet || git commit -m "Add Nasdaq backtest results"

          git push
