name: Telegram Yearly Archive Sync

on:
  schedule:
    # يشتغل يومياً الساعة 21:30 UTC (بعد workflow جلب البيانات اليومية)
    - cron: "30 21 * * *"
  workflow_dispatch: {}   # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run archive sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sync_to_telegram.py

      - name: Commit tracking files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram-ids.json telegram-hashes.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي: أرشيف NASDAQ السنوي"
          git push
