name: جمع بيانات NASDAQ + NYSE اليومية

on:
  schedule:
    - cron: '0 22 * * 1-5'

  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # =========================================================
      # إنشاء قائمة NASDAQ + NYSE
      # =========================================================
      - name: Fetch NASDAQ + NYSE symbols
        run: |
          python scripts/fetch-us-symbols.py

      # =========================================================
      # جلب OHLCV لجميع الرموز
      # =========================================================
      - name: Fetch daily OHLC
        run: |
          python scripts/fetch-finnhub-ohlc.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      # =========================================================
      # دمج البيانات وحفظ اليوم الحالي
      # =========================================================
      - name: Merge and cleanup
        run: |
          python scripts/merge-and-cleanup.py

      # =========================================================
      # حفظ التغييرات
      # =========================================================
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            daily-data/ \
            latest.json \
            symbols-reference.json

          git diff --cached --quiet || \
            git commit -m "تحديث بيانات NASDAQ و NYSE اليومية"

          git push
