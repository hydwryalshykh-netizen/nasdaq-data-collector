name: Finnhub Historical Backfill 1Y

on:
  workflow_dispatch:

jobs:
  collect-finnhub-historical:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4
        with:
          ref: main-fixed

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات
        run: pip install requests

      - name: جلب البيانات التاريخية من Finnhub
        run: python scripts/fetch-finnhub-historical.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      - name: حفظ ملف البيانات التاريخية فقط
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historical-data/finnhub_1y.json
          git commit -m "تحديث أرشيف Finnhub التاريخي (سنة كاملة)" || exit 0
          git push origin main-fixed
